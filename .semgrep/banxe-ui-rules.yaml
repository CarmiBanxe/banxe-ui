rules:
  # ── I-05: No parseFloat / Number() on monetary amounts ───────────────────────
  - id: banxe-no-parsefloat-amounts
    pattern: parseFloat($X)
    message: |
      I-05 VIOLATION: parseFloat() may be used on a monetary value.
      All monetary values must stay as string until display formatting.
      Reference: banxe-architecture/INVARIANTS.md#I-05
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - "apps/**/*.tsx"
        - "apps/**/*.ts"
        - "packages/**/*.tsx"

  - id: banxe-no-number-cast-amounts
    pattern: Number($AMOUNT)
    message: |
      I-05 WARNING: Number() cast may be used on a monetary amount.
      Verify this is not a financial value — keep as Decimal/string if it is.
    languages: [typescript]
    severity: WARNING
    paths:
      include:
        - "apps/**/*.tsx"
        - "packages/ui/src/financial/**/*.tsx"

  # ── Hardcoded hex colors (must use Tailwind tokens) ──────────────────────────
  - id: banxe-no-hardcoded-hex-in-style
    # Detects bare hex colors in style= props — excludes CSS variable fallbacks.
    # Allowed: var(--token, #hex) — these are intentional design-token fallbacks.
    # Blocked:  style={{ background: '#1A7FD4' }} — use var(--token, #hex) or Tailwind.
    pattern-regex: "style=\\{\\{[^}]*(?<!var\\([^)]{0,100})'#[0-9a-fA-F]{6}'"
    message: |
      DESIGN VIOLATION: Hardcoded hex color in JSX style prop (web).
      Use Tailwind classes from tailwind.config.ts: text-primary, bg-bg-surface, etc.
      Exception: CSS variable fallbacks like var(--token, #hex) are intentional.
    languages: [typescript]
    severity: WARNING
    paths:
      include:
        - "apps/web-vite/src/**/*.tsx"

  # ── No console.log in production UI code ─────────────────────────────────────
  - id: banxe-no-console-log
    pattern: console.log(...)
    message: |
      Remove console.log() before committing.
      Use console.warn() or console.error() only (allowed by ESLint rule no-console).
    languages: [typescript]
    severity: WARNING
    paths:
      include:
        - "apps/**/*.ts"
        - "apps/**/*.tsx"
        - "packages/**/*.ts"
        - "packages/**/*.tsx"

  # ── ComplianceFlag required for BLOCKED/REVIEW transactions ──────────────────
  - id: banxe-compliance-status-check
    pattern: $TX.status === "BLOCKED"
    message: |
      COMPLIANCE: Ensure BLOCKED transactions render <ComplianceFlag type="BLOCKED" />.
      Required for FCA audit trail visibility.
    languages: [typescript]
    severity: WARNING
    paths:
      include:
        - "apps/web-vite/src/screens/**/*.tsx"
