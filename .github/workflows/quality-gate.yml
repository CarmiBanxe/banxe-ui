name: BANXE UI Quality Gate
# IL-068 | banxe-ui

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (packages/ui)
        run: npx tsc --noEmit -p packages/ui/tsconfig.json

      - name: ESLint
        run: npx eslint packages/ui/src apps/web-vite/src --ext .ts,.tsx --max-warnings 0 || true

      - name: Vitest with coverage (unit + a11y + e2e)
        run: |
          npx vitest run --coverage --reporter=verbose
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY

      - name: Semgrep
        run: |
          pip install semgrep
          semgrep --config .semgrep/banxe-ui-rules.yaml apps/web-vite/src packages/ui/src --error || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-ui
          path: coverage/
