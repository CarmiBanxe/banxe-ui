name: BANXE UI Quality Gate
# IL-068 | banxe-ui

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: ESLint
        run: npx eslint packages/ui/src apps/web/src --ext .ts,.tsx --max-warnings 0

      - name: Vitest with coverage
        run: |
          npx vitest run --coverage --reporter=verbose
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY

      - name: Semgrep
        run: |
          pip install semgrep
          semgrep --config .semgrep/banxe-ui-rules.yaml apps/web/src packages/ui/src --error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-ui
          path: coverage/
